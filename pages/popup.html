<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Guardian</title>
  <style>
    :root {
      --tan-bg: #EFE6D6;
      --card: #FBF6EC;
      --ink: #2B2621;
      --ink-soft: #5C5348;
      --moss: #6B7A5E;
      --moss-dark: #4F5C45;
      --clay: #A97452;
      --danger: #B4432E;
      --danger-dark: #93341F;
      --line: #DCD0BC;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 320px;
      background: var(--tan-bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 18px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .header-mark {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--moss);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-mark svg {
      width: 14px;
      height: 14px;
      stroke: #FBF6EC;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }

    .domain-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }

    #current-domain {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 14px;
      word-break: break-all;
      margin-bottom: 12px;
    }

    #current-status {
      margin-bottom: 16px;
    }

    .status-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
    }

    .status-blocked {
      background: rgba(180, 67, 46, 0.12);
      color: var(--danger-dark);
    }

    .status-safe {
      background: rgba(107, 122, 94, 0.14);
      color: var(--moss-dark);
    }

    .status-okay {
      background: rgba(169, 116, 82, 0.14);
      color: var(--clay);
    }

    .status-unknown {
      background: rgba(92, 83, 72, 0.1);
      color: var(--ink-soft);
    }

    .status-loading {
      background: rgba(92, 83, 72, 0.08);
      color: var(--ink-soft);
    }

    button {
      width: 100%;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      padding: 11px 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease;
    }

    button:active { transform: scale(0.98); }

    .btn-danger {
      background: var(--danger);
      color: #FBF6EC;
    }

    .btn-danger:hover { background: var(--danger-dark); }

    .btn-disabled {
      background: rgba(92, 83, 72, 0.12);
      color: var(--ink-soft);
      cursor: default;
      pointer-events: none;
    }

    .btn-disabled:active { transform: none; }

    .stats {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .stat {
      flex: 1;
      background: rgba(43, 38, 33, 0.03);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
    }

    .stat-value {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
    }

    .stat-label {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    #toast {
      display: none;
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      color: var(--moss-dark);
      background: rgba(107, 122, 94, 0.1);
      border-radius: 8px;
      padding: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z"></path>
      </svg>
    </div>
    <div class="header-title">Web Guardian</div>
  </div>

  <div class="card">
    <div class="domain-label">Current site</div>
    <div id="current-domain">—</div>

    <div id="current-status">
      <span class="status-badge status-loading">Checking…</span>
    </div>

    <button id="btn-block-site" class="btn-danger">Block this site</button>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="blocked-count">—</div>
        <div class="stat-label">Blocked</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="total-count">—</div>
        <div class="stat-label">Tracked</div>
      </div>
    </div>

    <div id="toast"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
